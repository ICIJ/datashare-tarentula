name: CI

on:
  push:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'poetry'

      - name: Install project dependencies
        run: make install

      - name: Run lint
        run: make lint

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    env:
      DATASHARE_VERSION: 21.20.5
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'poetry'

      - name: Download Datashare .deb
        run: wget "https://github.com/ICIJ/datashare-installer/releases/download/${DATASHARE_VERSION}/datashare-${DATASHARE_VERSION}.deb"

      - name: Install Datashare
        run: |
          sudo apt-get update || true
          sudo apt-get install -y "./datashare-${DATASHARE_VERSION}.deb"

      - name: Start Datashare in background
        # The launcher runs the jar with $JAVA_HOME's java, and the runner defaults to Java 17
        env:
          JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
        run: nohup datashare -p test-datashare -u test > datashare.log 2>&1 &

      - name: Install project dependencies
        run: make install

      - name: Wait for Datashare to be up
        # Datashare downloads its embedded Elasticsearch on first start, and answers 503 until the index is ready
        run: wget --retry-connrefused --retry-on-http-error=503 --waitretry=5 --read-timeout=30 --timeout=30 -t 60 http://localhost:8080

      - name: Wait for Elasticsearch cluster to be ready
        run: wget -q -O - --retry-connrefused --waitretry=5 --read-timeout=60 --timeout=60 -t 10 "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=60s"

      - name: Run tests
        env:
          TEST_ELASTICSEARCH_URL: http://localhost:9200
        run: make test

      - name: Show Datashare log
        if: failure()
        run: cat datashare.log
